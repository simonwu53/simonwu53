name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-cards.yml

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATS_OPTS: show_icons=true&hide_border=true&include_all_commits=true&count_private=true&border_radius=10
      LANGS_OPTS: layout=compact&langs_count=8&hide_border=true&border_radius=10&exclude_repo=DCGAN-tensorflow,ImagePicker,Django,webcrawl
    steps:
      - uses: actions/checkout@v6

      # --- GitHub stats (dark + light) ---
      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=catppuccin_mocha&${{ env.STATS_OPTS }}
          path: profile/stats-dark.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=catppuccin_latte&${{ env.STATS_OPTS }}
          path: profile/stats-light.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # --- Top languages (dark + light) ---
      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=catppuccin_mocha&${{ env.LANGS_OPTS }}
          path: profile/top-langs-dark.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=catppuccin_latte&${{ env.LANGS_OPTS }}
          path: profile/top-langs-light.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # --- Contribution snake (replaces the discontinued activity graph) ---
      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-light.svg?palette=github-light&color_snake=#8839ef
            profile/snake-dark.svg?palette=github-dark&color_snake=#cba6f7

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
